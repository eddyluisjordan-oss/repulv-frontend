<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competitor Spy — RepuLV</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#c8a84b;--gold-light:#f5d98e;--bg:#08080f;--surface:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.07);--text:#e8e6f0;--muted:#555;--green:#22c55e;--red:#ef4444;--yellow:#eab308}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:rgba(255,255,255,0.02);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:20px;font-weight:900}
.logo span{color:var(--gold)}
.back{background:none;border:1px solid var(--border);color:var(--muted);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;text-decoration:none;display:inline-block}
.main{padding:32px;max-width:1100px;margin:0 auto}
.page-title{font-size:24px;font-weight:900;letter-spacing:-0.5px;margin-bottom:4px}
.page-sub{color:var(--muted);font-size:14px;margin-bottom:32px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px}
.card-title{font-size:15px;font-weight:800;margin-bottom:16px}
.form-label{display:block;font-size:11px;font-weight:700;color:#666;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:8px}
.form-input{width:100%;padding:12px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none;margin-bottom:0}
.form-input:focus{border-color:var(--gold)}
.form-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.btn-primary{padding:11px 24px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#0a0a0f;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-sm{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid;font-family:inherit}
.btn-gold{border-color:rgba(200,168,75,0.3);background:rgba(200,168,75,0.08);color:var(--gold)}
.btn-red{border-color:rgba(239,68,68,0.2);background:transparent;color:#666}
.btn-red:hover{border-color:var(--red);color:var(--red)}
.comp-card{background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:12px}
.comp-name{font-size:16px;font-weight:800;margin-bottom:4px}
.comp-url{font-size:12px;color:var(--muted);margin-bottom:16px}
.comp-rating{font-size:32px;font-weight:900;color:var(--gold);margin-bottom:4px}
.comp-change-pos{color:var(--green);font-size:13px;font-weight:700}
.comp-change-neg{color:var(--red);font-size:13px;font-weight:700}
.insight-box{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:10px;padding:14px;margin-top:12px;font-size:13px;color:#f87171;line-height:1.5}
.insight-box.opportunity{background:rgba(34,197,94,0.08);border-color:rgba(34,197,94,0.2);color:#4ade80}
.rating-input{width:80px;padding:8px 10px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:inherit;outline:none;text-align:center}
.rating-input:focus{border-color:var(--gold)}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.toast{position:fixed;bottom:24px;right:24px;background:rgba(15,15,26,0.95);border:1px solid rgba(200,168,75,0.3);border-radius:12px;padding:14px 20px;font-size:13px;color:var(--text);z-index:9999;transform:translateY(100px);opacity:0;transition:all 0.3s}
.toast.show{transform:translateY(0);opacity:1}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="topbar">
  <div class="logo">Repu<span>LV</span> <span style="font-size:13px;font-weight:500;color:var(--muted);margin-left:8px;">Competitor Spy</span></div>
  <a href="dashboard.html" class="back">← Dashboard</a>
</div>
<div class="main">
  <div class="page-title">🕵️ Competitor Spy Mode</div>
  <div class="page-sub">Track your top competitors' ratings. Get alerted when they drop so you can capture their customers.</div>

  <div class="card">
    <div class="card-title">Add a Competitor</div>
    <div class="form-row">
      <div>
        <label class="form-label">Competitor Name</label>
        <input type="text" class="form-input" id="comp-name" placeholder="Joe's Restaurant">
      </div>
      <div>
        <label class="form-label">Google Maps URL (optional)</label>
        <input type="url" class="form-input" id="comp-google" placeholder="https://maps.google.com/...">
      </div>
      <div>
        <label class="form-label">Yelp URL (optional)</label>
        <input type="url" class="form-input" id="comp-yelp" placeholder="https://yelp.com/biz/...">
      </div>
    </div>
    <button class="btn-primary" onclick="addCompetitor()">+ Add Competitor</button>
  </div>

  <div id="competitors-list"><div class="empty">No competitors tracked yet. Add one above to start spying!</div></div>
</div>

<script>
const API = 'https://repulv-backend-production.up.railway.app';
const token = localStorage.getItem('repulv_token');
if (!token) window.location.href = 'dashboard.html';
let bizId = null;

async function getBizId() {
  if (bizId) return bizId;
  const res = await fetch(`${API}/businesses`, { headers: { 'Authorization': `Bearer ${token}` } });
  const d = await res.json();
  bizId = d.businesses?.[0]?.id;
  return bizId;
}

async function addCompetitor() {
  const name = document.getElementById('comp-name').value.trim();
  const google_url = document.getElementById('comp-google').value.trim();
  const yelp_url = document.getElementById('comp-yelp').value.trim();
  if (!name) { showToast('Please enter competitor name'); return; }
  const business_id = await getBizId();
  if (!business_id) { showToast('Add your business in Settings first'); return; }
  const res = await fetch(`${API}/competitors`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
    body: JSON.stringify({ name, google_url, yelp_url, business_id })
  });
  const d = await res.json();
  if (d.success) {
    showToast('✓ Competitor added!');
    document.getElementById('comp-name').value = '';
    document.getElementById('comp-google').value = '';
    document.getElementById('comp-yelp').value = '';
    loadCompetitors();
  }
}

async function loadCompetitors() {
  const res = await fetch(`${API}/competitors`, { headers: { 'Authorization': `Bearer ${token}` } });
  const d = await res.json();
  const list = document.getElementById('competitors-list');
  if (!d.competitors?.length) { list.innerHTML = '<div class="empty">No competitors tracked yet. Add one above!</div>'; return; }
  list.innerHTML = d.competitors.map(c => `
    <div class="comp-card" id="comp-${c.id}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div class="comp-name">${c.name}</div>
          <div class="comp-url">${c.google_url ? '📍 ' + c.google_url.slice(0,50) + '...' : 'No URL added'}</div>
        </div>
        <button class="btn-sm btn-red" onclick="deleteCompetitor(${c.id})">Remove</button>
      </div>
      <div style="display:flex;align-items:center;gap:20px;margin-bottom:12px;">
        <div>
          <div class="comp-rating">${c.last_rating ? c.last_rating + '★' : '—'}</div>
          <div style="font-size:12px;color:var(--muted);">Current rating</div>
        </div>
        ${c.rating_change ? `<div class="${c.rating_change < 0 ? 'comp-change-pos' : 'comp-change-neg'}">${c.rating_change < 0 ? '↓ ' + Math.abs(c.rating_change) + ' dropped' : '↑ +' + c.rating_change + ' improved'}</div>` : ''}
        <div style="font-size:12px;color:var(--muted);">${c.last_checked ? 'Last checked: ' + new Date(c.last_checked).toLocaleDateString() : 'Never checked'}</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="font-size:13px;color:var(--muted);">Update rating:</span>
        <input type="number" class="rating-input" id="rating-${c.id}" placeholder="4.2" step="0.1" min="1" max="5">
        <button class="btn-sm btn-gold" onclick="checkRating(${c.id})">Check Rating</button>
      </div>
      ${c.insight ? `<div class="insight-box opportunity">${c.insight}</div>` : ''}
    </div>
  `).join('');
}

async function checkRating(id) {
  const input = document.getElementById('rating-' + id);
  const current_rating = parseFloat(input.value);
  if (!current_rating || current_rating < 1 || current_rating > 5) { showToast('Enter a valid rating (1-5)'); return; }
  const res = await fetch(`${API}/competitors/${id}/check`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
    body: JSON.stringify({ current_rating })
  });
  const d = await res.json();
  if (d.insight) showToast(d.insight);
  else showToast('Rating updated!');
  loadCompetitors();
}

async function deleteCompetitor(id) {
  await fetch(`${API}/competitors/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
  loadCompetitors();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
}

loadCompetitors();
</script>
</body>
</html>
